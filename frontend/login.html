<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — AgriMitra</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0d1f13">
</head>
<body>
  <div class="utility-controls" style="position:fixed;top:18px;right:20px;z-index:20;">
    <div id="google_translate_element"></div>
    <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle light/dark theme">☀️</button>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand"><a href="index.html">AgriMitra</a></div>
      <h1>Welcome back</h1>
      <p class="auth-sub">Login karke apna dashboard aur crop recommendations dekhein.</p>

      <div id="auth-error" class="auth-error"></div>

      <form id="login-form" class="auth-form">
        <div class="form-field">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" required placeholder="ramesh@example.com">
        </div>
        <div class="form-field">
          <label for="li-password">Password</label>
          <input type="password" id="li-password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn primary" style="width:100%;justify-content:center;margin-top:6px;">Login →</button>
      </form>

      <div class="auth-switch">New to AgriMitra? <a href="signup.html">Create an account</a></div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
